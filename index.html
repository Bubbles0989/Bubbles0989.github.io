<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Julian Eddy - Video Editor</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="src/styles.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Droid+Sans:wght@400;700&family=Droid+Serif:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="home-page">
	<header class="site-header">
		<a class="site-title" href="index.html">Julian Eddy</a>
		<nav class="site-nav" aria-label="Main navigation">
			<span class="site-nav-frame">the (</span>
			<a href="index.html" aria-current="page">home</a><span class="site-nav-divider">/</span>
			<a href="src/work.html">work</a><span class="site-nav-divider">/</span>
			<a href="src/about%20me.html">about me</a><span class="site-nav-divider">/</span>
			<a href="src/contact.html">contact</a><span class="site-nav-divider">/</span>
			<a href="https://www.imdb.com/name/nm12898570/" target="_blank" rel="noopener noreferrer">IMDb</a>
			<span class="site-nav-frame">) eddit</span>
		</nav>
	</header>
	<main>
		<div class="video-frame">
			<iframe
				src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
				title="Julian Eddy 2025 showreel"
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				referrerpolicy="strict-origin-when-cross-origin"
				allowfullscreen>
			</iframe>
		</div>
		<section class="home-contact" aria-labelledby="home-contact-title">
			<h2 id="home-contact-title">Get in touch</h2>
			<form id="home-contact-form">
				<input name="name" type="text" placeholder="Enter your name" aria-label="Your name" autocomplete="name" required>
				<textarea name="message" placeholder="Enter your message" aria-label="Your message" required></textarea>
				<button type="submit">SUBMIT</button>
			</form>
		</section>
	</main>
	<footer>
		<div>Julian Eddy</div>
		<a href="mailto:julian@theeddit.com">julian@theeddit.com</a>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(function () {
			$('#home-contact-form').on('submit', function (event) {
				event.preventDefault();
				const name = $(this).find('[name="name"]').val();
				const message = $(this).find('[name="message"]').val();
				const subject = `Website contact from ${name}`;
				const body = `Name: ${name}\n\n${message}`;
				window.location.href = `mailto:julian@theeddit.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
			});
		});
	</script>
</body>
</html>
