<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Basic Webpage</title>
	<link rel="stylesheet" href="styles.css">
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #f3f4f6;
		}

		main {
			padding: 2rem;
			text-align: center;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
		}

		button {
			padding: 0.7rem 1rem;
			color: #fff;
			background: #2563eb;
			border: 0;
			border-radius: 6px;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<main>
		<h1>Hello, world!</h1>
		<p id="message">A basic webpage made with HTML, CSS, and JavaScript.</p>
		<button id="greet-button" type="button">Click me</button>
	</main>

	<script src="script.js"></script>
	<script>
		document.getElementById('greet-button').addEventListener('click', () => {
			document.getElementById('message').textContent = 'Thanks for clicking!';
		});
	</script>
</body>
</html>
