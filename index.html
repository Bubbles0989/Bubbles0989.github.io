<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="src/styles.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="home-page">
	<header class="site-header">
		<a class="site-title" href="index.html">Julian Eddy</a>
		<nav class="site-nav" aria-label="Main navigation">
			<span class="site-nav-frame">the (</span>
			<a href="src/film.html">film</a><span class="site-nav-divider">/</span>
			<a href="src/series.html">series</a><span class="site-nav-divider">/</span>
			<a href="src/branded.html">branded</a><span class="site-nav-divider">/</span>
			<a href="src/contact.html">social</a>
			<span class="site-nav-frame">) eddit</span>
		</nav>
		<details class="site-menu">
			<summary><span class="site-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span><span class="site-menu-label">Site navigation</span></summary>
			<nav class="site-menu-panel" aria-label="Site navigation">
				<a href="index.html">Home</a>
				<a href="src/work.html">Work</a>
				<a href="src/about%20me.html">About Me</a>
				<a href="src/contact.html">Contact</a>
			</nav>
		</details>
	</header>
	<main>
		<div class="video-frame">
			<iframe
				src="https://www.youtube-nocookie.com/embed/0anCPGByNEw?si=fk_KdAP8OyRWldl5"
				title="Julian Eddy 2025 showreel"
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				referrerpolicy="strict-origin-when-cross-origin"
				allowfullscreen>
			</iframe>
		</div>
		<nav class="home-work-links" aria-label="Browse work by category">
			<a href="src/film.html">Film</a>
			<a href="src/series.html">Series</a>
			<a href="src/social-media.html">Social Media</a>
			<a href="src/branded.html">Branded</a>
		</nav>
		<section class="home-contact" aria-labelledby="home-contact-title">
			<h2 id="home-contact-title">Get in touch</h2>
			<form id="home-contact-form">
				<input name="name" type="text" placeholder="Enter your name" aria-label="Your name" autocomplete="name" required>
				<textarea name="message" placeholder="Enter your message" aria-label="Your message" required></textarea>
				<button type="submit">SUBMIT</button>
			</form>
		</section>
	</main>
	<footer>
		<div>Julian Eddy</div>
		<a href="mailto:julian@theeddit.com">julian@theeddit.com</a>
		<a href="https://www.imdb.com/name/nm12898570/" target="blank" rel="noopener noreferrer">IMDb</a>
		<a href="https://www.linkedin.com/in/julian-eddy/" target="blank" rel="noopener noreferrer">LinkedIn</a>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(function () {
			$('#home-contact-form').on('submit', function (event) {
				event.preventDefault();
				const name = $(this).find('[name="name"]').val();
				const message = $(this).find('[name="message"]').val();
				const subject = `Website contact from ${name}`;
				const body = `Name: ${name}\n\n${message}`;
				window.location.href = `mailto:julian@theeddit.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
			});
		});
	</script>
</body>
</html>
