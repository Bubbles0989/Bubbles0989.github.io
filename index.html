<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Julian Eddy - Video Editor</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Droid+Serif:wght@400;700&display=swap" rel="stylesheet">
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			min-height: 100svh;
			display: flex;
			flex-direction: column;
			font-family: 'Droid Serif', serif;
			color: rgba(255, 255, 255, 0.85);
			background: #e6e0c8;
		}

		.site-header {
			width: 100%;
			min-height: 104px;
			padding: 24px clamp(20px, 2.25vw, 36px);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
			color: #242320;
		}

		.site-title {
			color: inherit;
			font-family: 'Droid Serif', serif;
			font-size: clamp(20px, 2vw, 26px);
			font-weight: 700;
			text-decoration: none;
		}

		.site-nav {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 12px clamp(18px, 2.5vw, 40px);
		}

		.site-nav a {
			color: #706e64;
			font-family: Arial, sans-serif;
			font-size: 12px;
			letter-spacing: 1px;
			text-decoration: none;
		}

		.site-nav a[aria-current="page"] {
			color: #242320;
			font-family: 'Droid Serif', serif;
			font-weight: 700;
		}

		main {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			width: min(calc(100% - 48px), 1140px);
			min-width: 0;
			margin: 0 auto 35px;
		}

		.video-frame {
			width: 100%;
			aspect-ratio: 16 / 9;
			background: #111;
			box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
		}

		.video-frame iframe {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
		}

		@media (max-width: 760px) {
			.site-header {
				align-items: flex-start;
				flex-direction: column;
				padding: 22px 20px;
			}

			.site-title {
				font-size: clamp(19px, 5vw, 22px);
			}

			.site-nav {
				gap: 16px 22px;
			}

			main {
				width: calc(100% - 40px);
				margin-bottom: 24px;
			}
		}
	</style>
</head>
<body>
	<header class="site-header">
		<a class="site-title" href="index.html">Julian Eddy - Video Editor</a>
		<nav class="site-nav" aria-label="Main navigation">
			<a href="index.html" aria-current="page">HOME</a>
			<a href="about%20me.html">ABOUT ME</a>
			<a href="https://www.linkedin.com/search/results/people/?keywords=Julian%20Eddy" target="_blank" rel="noopener noreferrer">LINKEDIN</a>
			<a href="https://www.imdb.com/find/?q=Julian%20Eddy" target="_blank" rel="noopener noreferrer">IMDB</a>
		</nav>
	</header>
	<main>
		<div class="video-frame">
			<iframe
				src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
				title="Julian Eddy 2025 showreel"
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				referrerpolicy="strict-origin-when-cross-origin"
				allowfullscreen>
			</iframe>
		</div>
	</main>
</body>
</html>
