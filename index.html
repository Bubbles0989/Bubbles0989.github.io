<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Julian Eddy - Video Editor</title>
	<link rel="stylesheet" href="src/styles.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Droid+Serif:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="home-page">
	<header class="site-header">
		<a class="site-title" href="index.html">Julian Eddy - Video Editor</a>
		<nav class="site-nav" aria-label="Main navigation">
			<a href="index.html" aria-current="page">HOME</a>
			<a href="src/about%20me.html">ABOUT ME</a>
			<a href="src/contact.html">CONTACT</a>
			<a href="https://www.imdb.com/name/nm12898570/" target="_blank" rel="noopener noreferrer">IMDB</a>
		</nav>
	</header>
	<main>
		<div class="video-frame">
			<iframe
				src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
				title="Julian Eddy 2025 showreel"
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				referrerpolicy="strict-origin-when-cross-origin"
				allowfullscreen>
			</iframe>
		</div>
		<section class="home-contact" aria-labelledby="home-contact-title">
			<h2 id="home-contact-title">Get in touch</h2>
			<form id="home-contact-form">
				<input name="name" type="text" placeholder="Enter your name" aria-label="Your name" autocomplete="name" required>
				<textarea name="message" placeholder="Enter your message" aria-label="Your message" required></textarea>
				<button type="submit">SUBMIT</button>
			</form>
		</section>
	</main>
	<footer>
		<div>Julian Eddy</div>
		<a href="mailto:julian@theeddit.com">julian@theeddit.com</a>
	</footer>
	<script>
		document.getElementById('home-contact-form').addEventListener('submit', (event) => {
			event.preventDefault();
			const fields = new FormData(event.currentTarget);
			const subject = `Website contact from ${fields.get('name')}`;
			const body = `Name: ${fields.get('name')}\n\n${fields.get('message')}`;
			window.location.href = `mailto:julian@theeddit.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
		});
	</script>
</body>
</html>
