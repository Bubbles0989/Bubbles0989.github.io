<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Basic Webpage</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Droid+Serif:wght@400;700&display=swap" rel="stylesheet">
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: 'Droid Serif', serif;
			color: rgba(255, 255, 255, 0.85);
			background: #e6e0c8;
		}

		main {
			padding: 2rem;
			text-align: center;
			background: rgb(0 0 0 / 85%);
			border-radius: 12px;
			box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
		}

		button {
			padding: 0.7rem 1rem;
			color: #fff;
			background: #2563eb;
			border: 0;
			border-radius: 6px;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<main>
		<h1>Hello, world!</h1>
		<p id="message">A basic webpage made with HTML, CSS, and JavaScript.</p>
		<button id="greet-button" type="button">Click me</button>
	</main>

	<script src="script.js"></script>
	<script>
		document.getElementById('greet-button').addEventListener('click', () => {
			window.location.href = 'contact.html';
		});
	</script>
</body>
</html>
